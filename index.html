<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f6feb">
<title>Счета и акты</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#15181d; --dim:#6b7280; --line:#e3e6ea;
    --acc:#1f6feb; --ok:#0f9d58; --warn:#b45309;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 8px;
    border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:17px}
  .sub{color:var(--dim);font-size:12px;margin-top:2px}
  main{max-width:720px;margin:0 auto;padding:12px 14px 120px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px;margin-bottom:10px}
  label{display:block;font-size:12px;color:var(--dim);margin:0 0 4px}
  input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);
    border-radius:10px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
  textarea{min-height:56px;resize:vertical}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .row .w90{flex:0 0 92px}
  .row .w120{flex:0 0 120px}
  .item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;
    background:#fbfcfd}
  .item h3{margin:0 0 8px;font-size:13px;color:var(--dim);font-weight:600;
    display:flex;justify-content:space-between;align-items:center}
  .del{color:#b91c1c;font-size:13px;background:none;border:0;padding:2px 6px;width:auto}
  button{font:inherit;cursor:pointer}
  .btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;
    background:var(--acc);color:#fff;font-weight:600;font-size:16px;margin-top:8px}
  .btn.sec{background:#eef1f5;color:var(--ink)}
  .btn.line{background:#fff;border:1px solid var(--line);color:var(--acc)}
  .hint{font-size:12px;color:var(--dim);margin-top:6px}
  .total{font-size:19px;font-weight:700;text-align:right;margin-top:4px}
  .warn{color:var(--warn);font-size:12px;margin-top:6px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(244,245,247,.96);
    border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    backdrop-filter:blur(6px)}
  .bar .row{max-width:720px;margin:0 auto}
  .bar .btn{margin-top:0}
  /* лист документа для печати и просмотра */
  #paper{display:none}
  @media print{
    header,main,.bar{display:none!important}
    #paper{display:block}
    body{background:#fff}
    @page{size:A4;margin:12mm 10mm}
  }
  #paper table{border-collapse:collapse;width:100%}
  #paper .b td,#paper .b th{border:1px solid #000;padding:4px 6px;font-size:11px}
  #paper h2{font-size:16px;text-align:center;margin:14px 0 10px}
  #paper .party{font-size:11px;margin:3px 0}
  #paper .tot{margin-top:6px;font-size:11px}
  #paper .tot td{padding:2px 6px}
  #paper .words{margin-top:10px;font-size:11.5px;font-weight:700}
  #paper .sign{margin-top:26px;font-size:11.5px;line-height:2.4}
  #paper .doc{font-family:Arial,Helvetica,sans-serif;color:#000}
  #paper .doc + .doc{page-break-before:always}
</style>
</head>
<body>

<header>
  <h1>Счета и акты</h1>
  <div class="sub" id="who">документы делаются прямо в телефоне</div>
</header>

<main>
  <div class="card" id="setup" style="display:none">
    <label for="setupText">Первый запуск: вставь данные, которые прислала ВАЛЛ-И</label>
    <textarea id="setupText" style="min-height:120px" placeholder='{"isp": {…}, "clients": {…}}'></textarea>
    <button class="btn" id="setupSave">Сохранить на этом телефоне</button>
    <div class="hint">Данные останутся только здесь и никуда не уходят. Повторять на каждом
      телефоне нужно один раз.</div>
  </div>

  <div class="card" id="cardClient">
    <label for="client">Заказчик</label>
    <select id="client"></select>
    <div id="oneoff" style="display:none;margin-top:8px">
      <label for="ooLine">Строка заказчика: ИНН, название, адрес</label>
      <textarea id="ooLine" placeholder="ИНН 7100000000 КПП-, ООО «Название», 300000, г. Тула, ул. Ленина, д. 1"></textarea>
      <label for="ooName" style="margin-top:8px">Короткое имя для акта</label>
      <input id="ooName" placeholder="ООО «Название»">
    </div>
  </div>

  <div class="card" id="cardDoc">
    <div class="row">
      <div class="w120">
        <label for="num">Номер</label>
        <input id="num" type="number" inputmode="numeric">
      </div>
      <div>
        <label for="date">Дата</label>
        <input id="date" type="date">
      </div>
    </div>
    <div class="hint" id="numHint"></div>
  </div>

  <div class="card" id="cardItems">
    <label>Услуги</label>
    <div id="items"></div>
    <button class="btn line" id="add">+ ещё строка</button>
    <div class="total" id="total">0,00 ₽</div>
  </div>

  <button class="btn sec" id="preset1">Заготовка: консультации</button>
  <button class="btn sec" id="preset2">Заготовка: перевозка</button>
</main>

<div class="bar">
  <div class="row">
    <button class="btn" id="word">Word</button>
    <button class="btn line" id="pdf">PDF</button>
  </div>
</div>

<div id="paper"></div>

<script src="docx.js"></script>
<script>
// Данные хранятся только в телефоне: страница лежит на открытом хостинге,
// а реквизиты и адреса клиентов туда выкладывать нельзя.
let CLIENTS = {};
let ISPDATA = null;

function loadData() {
  try {
    const raw = localStorage.getItem('schet-data');
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || !d.isp || !d.clients) return false;
    ISPDATA = d.isp;
    CLIENTS = d.clients;
    window.SCHET.setIsp(d.isp);
    return true;
  } catch (e) { return false; }
}

function saveData(text) {
  const d = JSON.parse(text);
  if (!d.isp || !d.clients) throw new Error('в файле нет разделов isp и clients');
  localStorage.setItem('schet-data', JSON.stringify(d));
  return loadData();
}

const KONS = 'Услуги по оказанию консультационных и информационных услуг (без договора)';
const PEREVOZ = 'Перевозка автомобиля , гос. номер , от  до , без договора';

const $ = (id) => document.getElementById(id);
const S = window.SCHET;
let items = [{ name: KONS, qty: 1, price: 0 }];

// ── номер: помним последний по годам, но всегда даём поправить ───────────────
function lastNumbers() {
  try { return JSON.parse(localStorage.getItem('schet-numbers') || '{}'); }
  catch (e) { return {}; }
}
function rememberNumber(year, n) {
  const all = lastNumbers();
  all[year] = n;
  try { localStorage.setItem('schet-numbers', JSON.stringify(all)); } catch (e) {}
}
function suggestNumber() {
  const y = String(new Date().getFullYear());
  const all = lastNumbers();
  const base = all[y] !== undefined ? all[y] : (y === '2026' ? 75 : 0);
  return base + 1;
}

function fillClients() {
  const sel = $('client');
  sel.innerHTML = Object.keys(CLIENTS)
    .map((k) => `<option value="${k}">${CLIENTS[k].short}</option>`).join('')
    + '<option value="__new">Разовый заказчик…</option>';
}

function currentClient() {
  const k = $('client').value;
  if (k === '__new') {
    return { short: $('ooName').value || 'Заказчик', line: $('ooLine').value.trim(),
             actName: $('ooName').value || 'Заказчик' };
  }
  return CLIENTS[k];
}

function renderItems() {
  $('items').innerHTML = items.map((it, i) => `
    <div class="item">
      <h3><span>Строка ${i + 1}</span>
        ${items.length > 1 ? `<button class="del" data-del="${i}">убрать</button>` : ''}</h3>
      <textarea data-name="${i}" placeholder="Что сделано">${it.name.replace(/</g, '&lt;')}</textarea>
      <div class="row" style="margin-top:8px">
        <div class="w90"><label>Кол-во</label>
          <input data-qty="${i}" type="number" inputmode="decimal" step="0.01" value="${it.qty}"></div>
        <div><label>Цена за штуку, ₽</label>
          <input data-price="${i}" type="number" inputmode="decimal" step="0.01" value="${it.price || ''}"></div>
      </div>
    </div>`).join('');
  updateTotal();
}

function updateTotal() {
  const sum = items.reduce((s, i) => s + (Number(i.qty) || 0) * (Number(i.price) || 0), 0);
  $('total').textContent = S.money(sum) + ' ₽';
  return sum;
}

function dateParts() {
  const d = $('date').value ? new Date($('date').value + 'T12:00:00') : new Date();
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return {
    d,
    str: `${dd}.${mm}.${d.getFullYear()}`,
    words: `«${dd}» ${S.MONTHS[d.getMonth()]} ${d.getFullYear()} г.`,
    file: `${dd}.${mm}.${d.getFullYear()}`,
  };
}

function collect() {
  const client = currentClient();
  if (!client.line) { alert('Заполни строку заказчика'); return null; }
  const clean = items
    .map((i) => ({ name: i.name.trim(), qty: Number(i.qty) || 1, price: Number(i.price) || 0 }))
    .filter((i) => i.name && i.price > 0);
  if (!clean.length) { alert('Добавь хотя бы одну услугу с ценой'); return null; }
  const number = Number($('num').value) || suggestNumber();
  return { client, items: clean, number, date: dateParts() };
}

function download(bytes, name, mime) {
  const blob = new Blob([bytes], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

$('word').addEventListener('click', () => {
  const data = collect();
  if (!data) return;
  const { client, items: list, number, date } = data;
  const inv = S.buildInvoice({ number, dateStr: date.str, client, items: list });
  const act = S.buildAct({ number, dateStr: date.str, dateWords: date.words, client, items: list });
  download(S.docxBytes(inv), `Счет №${number} от ${date.file} ${client.short}.docx`,
    'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
  setTimeout(() => download(S.docxBytes(act), `Акт №${number} от ${date.file} ${client.short}.docx`,
    'application/vnd.openxmlformats-officedocument.wordprocessingml.document'), 600);
  rememberNumber(String(date.d.getFullYear()), number);
  $('numHint').textContent = `Выписан № ${number}. Следующий будет ${number + 1}.`;
});

$('pdf').addEventListener('click', () => {
  const data = collect();
  if (!data) return;
  $('paper').innerHTML = paperHtml(data);
  rememberNumber(String(data.date.d.getFullYear()), data.number);
  $('numHint').textContent = `Выписан № ${data.number}. Следующий будет ${data.number + 1}.`;
  setTimeout(() => window.print(), 100);
});

// ── бумажный вид: он же уходит в PDF через печать ────────────────────────────
function paperHtml({ client, items: list, number, date }) {
  const I = S.ISP;
  const total = list.reduce((s, i) => s + i.qty * i.price, 0);
  const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const rows = list.map((it, i) => `<tr>
      <td style="text-align:center">${i + 1}</td><td>${esc(it.name)}</td>
      <td style="text-align:center">шт.</td><td style="text-align:center">${S.money(it.qty)}</td>
      <td style="text-align:right">${S.money(it.price)}</td>
      <td style="text-align:right">${S.money(it.qty * it.price)}</td></tr>`).join('');
  const actRows = list.map((it, i) => `<tr>
      <td style="text-align:center">${i + 1}</td><td>${esc(it.name)}</td>
      <td style="text-align:center">${S.money(it.qty)}</td><td style="text-align:center">шт</td>
      <td style="text-align:right">${S.money(it.price)}</td>
      <td style="text-align:right">${S.money(it.qty * it.price)}</td></tr>`).join('');
  let words = S.rublesInWords(total);
  const actWords = words.charAt(0).toLowerCase() + words.slice(1).replace(' копеек', ' коп.');

  return `
  <div class="doc">
    <table class="b">
      <tr><td colspan="2" style="width:56%">${esc(I.bank)}<div style="font-size:9px;color:#444">Банк получателя</div></td>
          <td style="width:12%">БИК</td><td>${I.bik}</td></tr>
      <tr><td colspan="2"></td><td>Сч. №</td><td>${I.ks}</td></tr>
      <tr><td style="width:8%">ИНН</td><td>${I.inn}</td><td>Сч. №</td><td>${I.rs}</td></tr>
      <tr><td colspan="2">${esc(I.name)}<div style="font-size:9px;color:#444">Получатель</div></td>
          <td colspan="2"></td></tr>
    </table>
    <h2>СЧЕТ № ${number} от ${date.str}г.</h2>
    <div class="party"><b>Исполнитель:</b> ИНН ${I.inn}, КПП-, ${esc(I.name)}, ${esc(I.address)}, тел. ${I.phone}</div>
    <div class="party"><b>Заказчик:</b> ${esc(client.line)}</div>
    <table class="b" style="margin-top:8px">
      <tr><th style="width:4%">№</th><th>Наименование товаров (работ, услуг)</th>
        <th style="width:8%">Ед.</th><th style="width:9%">Кол-во</th>
        <th style="width:12%">Цена</th><th style="width:12%">Сумма</th></tr>
      ${rows}
    </table>
    <table class="tot"><tr><td style="text-align:right"><b>Итого:</b></td>
      <td style="width:14%;text-align:right"><b>${S.money(total)}</b></td></tr>
      <tr><td style="text-align:right">Без налога (НДС)</td><td></td></tr>
      <tr><td style="text-align:right"><b>Всего к оплате:</b></td>
      <td style="text-align:right"><b>${S.money(total)}</b></td></tr></table>
    <div class="words">Всего наименований ${list.length}, на сумму: ${S.money(total)} руб.</div>
    <div class="words">${words}</div>
    <div class="sign">Руководитель &nbsp;_____________________ (${I.signShort})<br>
      Бухгалтер &nbsp;&nbsp;&nbsp;&nbsp;_____________________ (${I.signShort})</div>
    <div style="margin-top:14px;font-size:11px">М.П.</div>
  </div>

  <div class="doc">
    <h2>АКТ № ${number} от ${date.words}</h2>
    <div class="party"><b>Исполнитель:</b> ${esc(I.shortName)}</div>
    <div class="party"><b>Заказчик:</b> ${esc(client.actName)}</div>
    <table class="b" style="margin-top:8px">
      <tr><th style="width:4%">№</th><th>Наименование работ, услуг</th>
        <th style="width:9%">Кол-во</th><th style="width:8%">Ед.</th>
        <th style="width:12%">Цена</th><th style="width:12%">Сумма</th></tr>
      ${actRows}
    </table>
    <table class="tot"><tr><td style="text-align:right"><b>Итого:</b></td>
      <td style="width:14%;text-align:right"><b>${S.money(total)}</b></td></tr>
      <tr><td style="text-align:right">Без налога (НДС)</td><td></td></tr></table>
    <div class="words">Всего оказано услуг ${list.length}, на сумму ${actWords}</div>
    <div style="font-size:9px;color:#444">(сумма прописью)</div>
    <div style="margin-top:10px;font-size:11px">Вышеперечисленные услуги выполнены полностью и в срок.
      Заказчик претензий по объему, качеству и срокам оказания услуг не имеет.</div>
    <div class="sign">Индивидуальный предприниматель<br>
      _________________________${I.sign}<br>М.П.</div>
    <div class="sign">Грузоотправитель/грузополучатель<br>
      _________________/_____________<br>М.П.</div>
  </div>`;
}

// ── обработчики ──────────────────────────────────────────────────────────────
$('items').addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.name !== undefined) items[t.dataset.name].name = t.value;
  if (t.dataset.qty !== undefined) items[t.dataset.qty].qty = t.value;
  if (t.dataset.price !== undefined) items[t.dataset.price].price = t.value;
  updateTotal();
});
$('items').addEventListener('click', (e) => {
  const i = e.target.dataset.del;
  if (i === undefined) return;
  items.splice(Number(i), 1);
  renderItems();
});
$('add').addEventListener('click', () => {
  if (items.length >= 5) { alert('Больше пяти строк в один счёт не ставим'); return; }
  const kind = (currentClient().kind === 'перевозка') ? PEREVOZ : KONS;
  items.push({ name: kind, qty: 1, price: 0 });
  renderItems();
});
$('preset1').addEventListener('click', () => { items = [{ name: KONS, qty: 1, price: 0 }]; renderItems(); });
$('preset2').addEventListener('click', () => { items = [{ name: PEREVOZ, qty: 1, price: 0 }]; renderItems(); });
$('client').addEventListener('change', () => {
  const isNew = $('client').value === '__new';
  $('oneoff').style.display = isNew ? 'block' : 'none';
  if (!isNew && items.length === 1 && !Number(items[0].price)) {
    items[0].name = CLIENTS[$('client').value].kind === 'перевозка' ? PEREVOZ : KONS;
    renderItems();
  }
});

(function init() {
  const ready = loadData();
  const blocks = ['cardClient', 'cardDoc', 'cardItems', 'preset1', 'preset2'];
  if (!ready) {
    $('setup').style.display = 'block';
    blocks.forEach((id) => { const el = $(id); if (el) el.style.display = 'none'; });
    document.querySelector('.bar').style.display = 'none';
  }
  $('setupSave').addEventListener('click', () => {
    try {
      saveData($('setupText').value.trim());
      location.reload();
    } catch (e) {
      alert('Не получилось прочитать данные: ' + e.message);
    }
  });
  if (!ready) return;

  fillClients();
  if (ISPDATA && ISPDATA.shortName) $('who').textContent = ISPDATA.shortName + ' · документы делаются в телефоне';
  const t = new Date();
  $('date').value = [t.getFullYear(), String(t.getMonth() + 1).padStart(2, '0'),
    String(t.getDate()).padStart(2, '0')].join('-');
  $('num').value = suggestNumber();
  $('numHint').textContent = 'Номер подставлен по памяти этого телефона. Если муж только что ' +
    'выписал счёт, посмотри последний файл в чате и поправь.';
  renderItems();
})();

</script>
</body>
</html>
